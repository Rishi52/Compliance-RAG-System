name: CI

on:
  push:
    branches:
      - main
      - refactor/resume-grade-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.13 tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency integrity
        run: python -m pip check

      - name: Check changed files for whitespace errors
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.sha }}"
          else
            git diff-tree --check --no-commit-id -r HEAD
          fi

      - name: Compile Python modules
        run: |
          python -m compileall -q \
            api \
            config \
            evaluation \
            generation \
            retrieval \
            scripts \
            tests
      - name: Validate container configuration
        run: |
          docker build --check .
          docker compose config --quiet
      - name: Run test suite
        run: python -m pytest -q