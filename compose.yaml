name: compliance-rag

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: compliance-rag-api:local
    init: true
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      COMPLIANCE_RAG_OLLAMA_BASE_URL: >-
        http://host.docker.internal:11434
      COMPLIANCE_RAG_OLLAMA_MODEL: >-
        ${COMPLIANCE_RAG_OLLAMA_MODEL:-llama3.2:3b}
      COMPLIANCE_RAG_CORS_ORIGINS: >-
        ${COMPLIANCE_RAG_CORS_ORIGINS:-http://127.0.0.1:5500,http://localhost:5500}
      HF_HOME: /home/appuser/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - type: bind
        source: ./data/processed
        target: /app/data/processed
        read_only: true

      - type: bind
        source: ./chroma_db
        target: /app/chroma_db

      - type: volume
        source: huggingface_cache
        target: /home/appuser/.cache/huggingface

    stop_grace_period: 30s

volumes:
  huggingface_cache: